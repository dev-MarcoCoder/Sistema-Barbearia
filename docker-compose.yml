# BarberAgenda na nuvem: banco MySQL + site (Tomcat) na mesma maquina.
# As senhas e a chave da IA ficam no arquivo .env (copie de .env.example).
#
#   docker compose up -d --build     sobe tudo
#   docker compose logs -f app       ve os logs do site
#   docker compose logs -f caddy     ve os logs do HTTPS
#   docker compose down              desliga (os dados do banco ficam guardados)

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?preencha MYSQL_ROOT_PASSWORD no .env}
      MYSQL_USER: barbearia
      MYSQL_PASSWORD: ${DB_SENHA:?preencha DB_SENHA no .env}
    # Configuracao economica para caber em servidor pequeno
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - dados-mysql:/var/lib/mysql
      # Cria as tabelas SO na primeira vez (quando o volume esta vazio)
      - ./database/barbearia.sql:/docker-entrypoint-initdb.d/01-barbearia.sql:ro
      - ./database/permissoes.sql:/docker-entrypoint-initdb.d/02-permissoes.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      DB_URL: jdbc:mysql://db:3306/barbearia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
      DB_USUARIO: barbearia
      DB_SENHA: ${DB_SENHA}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    expose:
      - "8080"

  # Porta de entrada do site: HTTPS automatico e repasse para o Tomcat
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMINIO: ${DOMINIO:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config

volumes:
  dados-mysql:
  caddy-dados:
  caddy-config:
